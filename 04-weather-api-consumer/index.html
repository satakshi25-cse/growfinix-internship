<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Explorer</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#e2e8f0;background:radial-gradient(circle at 15% 10%,#164e6380,transparent 30%),radial-gradient(circle at 90% 80%,#312e8180,transparent 30%),#07111f}
.app{width:min(100% - 32px,1050px);margin:auto;padding:55px 0}.hero{text-align:center}.eyebrow{color:#67e8f9;font-size:12px;font-weight:bold;letter-spacing:3px}.hero h1{font-size:clamp(42px,7vw,80px);margin:10px 0}.subtitle{color:#94a3b8;max-width:600px;margin:auto;font-size:17px;line-height:1.6}.search{display:flex;gap:10px;max-width:650px;margin:30px auto}.search input{flex:1;min-width:0;padding:15px 18px;border:1px solid #334155;border-radius:14px;background:#0f172a;color:white;outline:none}.search input:focus{border-color:#22d3ee}.search button{padding:0 22px;border:0;border-radius:14px;background:#22d3ee;color:#082f49;font-weight:bold;cursor:pointer}.status{min-height:25px;color:#94a3b8}.error{color:#fda4af}.hidden{display:none}.current{margin-top:40px;padding:28px;border:1px solid #1e293b;border-radius:24px;background:#0f172acc;box-shadow:0 25px 70px #0004}.location{display:flex;justify-content:space-between;gap:20px}.location h2{margin:0;font-size:27px}.muted{color:#94a3b8}.temperature{display:flex;align-items:center;gap:16px;margin:30px 0}.icon{font-size:70px}.temp{font-size:64px;font-weight:900;line-height:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:16px;background:#ffffff08}.stat strong{display:block;font-size:20px;margin-top:5px}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.day{padding:18px 14px;border:1px solid #1e293b;border-radius:18px;background:#0f172ab3;text-align:center}.day .icon{font-size:40px}.day strong{display:block;margin:8px 0}.day small{color:#94a3b8}@media(max-width:700px){.app{padding:35px 0}.search{flex-direction:column}.search button{padding:14px}.location{flex-direction:column}.stats{grid-template-columns:1fr}.forecast{grid-template-columns:1fr 1fr}}@media(max-width:420px){.forecast{grid-template-columns:1fr}}
</style></head>
<body><main class="app"><section class="hero"><p class="eyebrow">GROWFINIX · TASK 4</p><h1>Weather Explorer</h1><p class="subtitle">Search a city and get current weather plus a 5-day forecast.</p><form id="form" class="search"><input id="city" placeholder="Enter a city, e.g. Kolkata" required><button>Search</button></form><div id="status" class="status"></div></section><section id="weather" class="hidden"></section></main>
<script>
const form=document.getElementById("form"),city=document.getElementById("city"),status=document.getElementById("status"),weather=document.getElementById("weather");
const codes={0:["☀️","Clear sky"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],71:["🌨️","Light snow"],73:["❄️","Snow"],75:["❄️","Heavy snow"],80:["🌦️","Rain showers"],81:["🌧️","Rain showers"],82:["⛈️","Heavy showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm + hail"],99:["⛈️","Thunderstorm + hail"]};
const info=c=>codes[c]||["🌡️","Unknown conditions"];
const date=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
function msg(t,e=false){status.textContent=t;status.className=e?"status error":"status"}
async function getPlace(name){let u=new URL("https://geocoding-api.open-meteo.com/v1/search");u.searchParams.set("name",name);u.searchParams.set("count","1");u.searchParams.set("language","en");u.searchParams.set("format","json");let r=await fetch(u);if(!r.ok)throw Error("Location service unavailable.");let d=await r.json();if(!d.results?.length)throw Error("City not found.");return d.results[0]}
async function getWeather(lat,lon){let u=new URL("https://api.open-meteo.com/v1/forecast");u.searchParams.set("latitude",lat);u.searchParams.set("longitude",lon);u.searchParams.set("current","temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m");u.searchParams.set("daily","weather_code,temperature_2m_max,temperature_2m_min");u.searchParams.set("timezone","auto");u.searchParams.set("forecast_days","5");let r=await fetch(u);if(!r.ok)throw Error("Weather service unavailable.");return r.json()}
function render(p,d){let c=d.current,i=info(c.weather_code);let days=d.daily.time.map((x,n)=>{let q=info(d.daily.weather_code[n]);return `<article class="day"><small>${date(x)}</small><div class="icon">${q[0]}</div><strong>${q[1]}</strong><div>${Math.round(d.daily.temperature_2m_max[n])}° / ${Math.round(d.daily.temperature_2m_min[n])}°</div></article>`}).join("");weather.innerHTML=`<div class="current"><div class="location"><div><h2>${p.name}${p.country?", "+p.country:""}</h2><p class="muted">${i[1]} · ${d.timezone}</p></div><span class="muted">Updated now</span></div><div class="temperature"><div class="icon">${i[0]}</div><div><div class="temp">${Math.round(c.temperature_2m)}°C</div><div class="muted">Feels like ${Math.round(c.apparent_temperature)}°C</div></div></div><div class="stats"><div class="stat">Humidity<strong>${c.relative_humidity_2m}%</strong></div><div class="stat">Wind<strong>${Math.round(c.wind_speed_10m)} km/h</strong></div><div class="stat">Coordinates<strong>${p.latitude.toFixed(2)}, ${p.longitude.toFixed(2)}</strong></div></div></div><div class="forecast">${days}</div>`;weather.classList.remove("hidden")}
form.addEventListener("submit",async e=>{e.preventDefault();let q=city.value.trim();if(!q)return;weather.classList.add("hidden");msg("Loading weather…");try{let p=await getPlace(q),d=await getWeather(p.latitude,p.longitude);render(p,d);msg("")}catch(err){msg(err.message||"Something went wrong.",true)}});
</script></body></html>
