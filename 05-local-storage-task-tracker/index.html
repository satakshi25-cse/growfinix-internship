<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow</title><script src="https://cdn.tailwindcss.com"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head>
<body class="bg-slate-950"><div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const KEY="growfinix-taskflow-v1";
const starter=[{id:"1",title:"Complete project documentation",priority:"High",completed:false},{id:"2",title:"Review API implementation",priority:"Medium",completed:true},{id:"3",title:"Push project to GitHub",priority:"Low",completed:false}];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:starter}catch{return starter}}
function App(){
 const [tasks,setTasks]=useState(load),[title,setTitle]=useState(""),[priority,setPriority]=useState("Medium"),[filter,setFilter]=useState("All"),[search,setSearch]=useState("");
 useEffect(()=>localStorage.setItem(KEY,JSON.stringify(tasks)),[tasks]);
 const add=e=>{e.preventDefault();let t=title.trim();if(!t)return;setTasks(x=>[{id:Date.now().toString(),title:t,priority,completed:false},...x]);setTitle("")};
 const shown=useMemo(()=>tasks.filter(t=>(filter==="All"||(filter==="Active"&&!t.completed)||(filter==="Completed"&&t.completed))&&t.title.toLowerCase().includes(search.toLowerCase())),[tasks,filter,search]);
 const done=tasks.filter(t=>t.completed).length;
 const styles={High:"bg-rose-400/10 text-rose-300",Medium:"bg-amber-400/10 text-amber-300",Low:"bg-emerald-400/10 text-emerald-300"};
 return <div className="min-h-screen bg-slate-950 text-slate-100"><div className="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
 <header><p className="text-sm font-bold uppercase tracking-[.25em] text-cyan-400">GROWFINIX · TASK 5</p><h1 className="mt-2 text-5xl font-black">TaskFlow</h1><p className="mt-2 text-slate-400">A CRUD task manager that remembers your tasks.</p></header>
 <section className="mt-8 grid gap-4 sm:grid-cols-3">{[["Total",tasks.length],["Active",tasks.length-done],["Completed",done]].map(x=><div key={x[0]} className="rounded-2xl border border-white/10 bg-white/[.03] p-5"><p className="text-sm text-slate-500">{x[0]}</p><p className="mt-1 text-3xl font-black">{x[1]}</p></div>)}</section>
 <form onSubmit={add} className="mt-6 rounded-2xl border border-white/10 bg-white/[.03] p-4"><div className="flex flex-col gap-3 sm:flex-row"><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="What needs to be done?" className="min-w-0 flex-1 rounded-xl border border-white/10 bg-slate-900 px-4 py-3 outline-none focus:border-cyan-400"/><select value={priority} onChange={e=>setPriority(e.target.value)} className="rounded-xl border border-white/10 bg-slate-900 px-4 py-3"><option>High</option><option>Medium</option><option>Low</option></select><button className="rounded-xl bg-cyan-400 px-6 py-3 font-black text-slate-950">Add Task</button></div></form>
 <section className="mt-6 rounded-2xl border border-white/10 bg-white/[.03] p-4"><div className="flex flex-col gap-3 lg:flex-row lg:justify-between">{<div className="flex gap-2">{["All","Active","Completed"].map(x=><button key={x} onClick={()=>setFilter(x)} className={"rounded-lg px-4 py-2 text-sm font-bold "+(filter===x?"bg-cyan-400 text-slate-950":"bg-white/5 text-slate-400")}>{x}</button>)}</div>}<div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search tasks..." className="w-full rounded-lg border border-white/10 bg-slate-900 px-3 py-2 text-sm outline-none lg:w-56"/><button type="button" onClick={()=>setTasks(x=>x.filter(t=>!t.completed))} className="whitespace-nowrap rounded-lg border border-white/10 px-3 py-2 text-sm text-slate-400">Clear done</button></div></div>
 <div className="mt-5 space-y-3">{shown.length?shown.map(t=><article key={t.id} className={"flex items-center gap-3 rounded-xl border border-white/10 bg-slate-900/70 p-4 "+(t.completed?"opacity-60":"")}><button onClick={()=>setTasks(x=>x.map(a=>a.id===t.id?{...a,completed:!a.completed}:a))} className={"grid h-6 w-6 shrink-0 place-items-center rounded-full border "+(t.completed?"border-cyan-400 bg-cyan-400 text-slate-950":"border-slate-600")}>{t.completed?"✓":""}</button><div className="min-w-0 flex-1"><p className={"font-semibold "+(t.completed?"line-through text-slate-500":"")}>{t.title}</p><span className={"mt-1 inline-block rounded-full px-2 py-0.5 text-xs "+styles[t.priority]}>{t.priority}</span></div><button onClick={()=>setTasks(x=>x.filter(a=>a.id!==t.id))} className="rounded-lg px-3 py-2 text-slate-500 hover:text-rose-300">Delete</button></article>):<div className="py-12 text-center text-slate-500">No tasks found.</div>}</div></section>
 <p className="mt-6 text-center text-xs text-slate-600">Data is stored in your browser's LocalStorage.</p>
 </div></div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
